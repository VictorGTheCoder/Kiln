[package]
name = "kiln"
version = "0.1.0"
edition = "2021"
description = "Spec-driven coding agent orchestrator for planning, parallel implementation, review, validation, and verified pull requests"
repository = "https://github.com/VictorGTheCoder/kiln"
readme = "README.md"
keywords = ["coding-agent", "ai-agents", "orchestration", "automation", "codex"]
categories = ["development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
libc = "0.2"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
